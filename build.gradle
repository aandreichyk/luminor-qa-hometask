plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'com.luminor.hometask'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
    selenideVersion = '7.17.0'
    restAssuredVersion = '6.0.1'
    allureVersion = '2.35.3'
    datafakerVersion = '2.7.0'
    jacksonVersion = '2.18.2'
    assertjVersion = '3.27.7'
    slf4jVersion = '2.0.18'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "com.codeborne:selenide:${selenideVersion}"
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-schema-validator:${restAssuredVersion}"

    testImplementation "io.qameta.allure:allure-jupiter:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"

    testImplementation "net.datafaker:datafaker:${datafakerVersion}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"

    testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
}

allure {
    version = '2.36.0'
    adapter {
        frameworks {
            junit5 {
                adapterVersion = "${allureVersion}"
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'selenide.headless', System.getProperty('selenide.headless', 'true')
    systemProperty 'headless', System.getProperty('headless', System.getProperty('selenide.headless', 'true'))
    ['browserSize', 'timeout', 'baseUrl', 'apiBaseUrl'].each { name ->
        def value = System.getProperty(name)
        if (value != null) {
            systemProperty name, value
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('apiTest', Test) {
    description = 'Runs tests tagged "api"'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'api'
    }
}

tasks.register('uiTest', Test) {
    description = 'Runs tests tagged "ui"'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ui'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}
